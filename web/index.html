<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabyte</title>
  <link rel="stylesheet" href="/assets/app.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <section class="panel" id="history-panel">
        <div class="panel-head">
          <h2>Sessions</h2>
          <button type="button" class="ghost" id="refresh-history">Refresh</button>
        </div>
        <div id="history" class="meta">No sessions yet.</div>
      </section>
      <section class="panel" id="settings-panel">
        <div class="panel-head">
          <h2>Settings</h2>
        </div>
        <div id="settings" class="meta">Checking persistence…</div>
      </section>
    </aside>

    <main class="workspace">
      <h1>Tabyte</h1>
      <p class="sub">Paste DDL, pick an engine, estimate local storage impact.</p>
      <div id="status">Loading…</div>

      <div class="row two">
        <div>
          <label for="engine">Engine</label>
          <select id="engine">
            <option value="postgres">PostgreSQL</option>
            <option value="sqlserver">SQL Server</option>
          </select>
        </div>
      </div>

      <label for="ddl">DDL</label>
      <textarea id="ddl">CREATE TABLE users (
  id INT,
  name VARCHAR(100)
);</textarea>

      <p style="margin:1rem 0">
        <button id="run" type="button">Analyze</button>
      </p>
      <div id="err"></div>
      <div id="out"></div>
    </main>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
