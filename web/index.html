<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tabyte</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a222c;
      --text: #e7eef6;
      --muted: #8b9bb0;
      --accent: #3d9a7a;
      --border: #2a3542;
      --danger: #d46a6a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      background: radial-gradient(1200px 600px at 10% -10%, #1b2a24, var(--bg));
      color: var(--text);
      min-height: 100vh;
    }
    main { max-width: 920px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    h1 { font-size: 2rem; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; }
    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    select, textarea, button {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0.7rem 0.8rem;
      font: inherit;
    }
    textarea { min-height: 180px; resize: vertical; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .row { display: grid; gap: 1rem; margin-bottom: 1rem; }
    @media (min-width: 640px) { .row.two { grid-template-columns: 200px 1fr; align-items: end; } }
    button {
      background: var(--accent);
      border-color: transparent;
      color: #04140f;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      padding: 0.75rem 1.25rem;
    }
    button:disabled { opacity: 0.5; cursor: wait; }
    #err { color: var(--danger); margin: 0.75rem 0; white-space: pre-wrap; }
    #out { margin-top: 1.5rem; }
    .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.75rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { text-align: left; padding: 0.5rem 0.4rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    ul { padding-left: 1.1rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Tabyte</h1>
    <p class="sub">Paste DDL, pick an engine, estimate local storage impact.</p>

    <div class="row two">
      <div>
        <label for="engine">Engine</label>
        <select id="engine">
          <option value="postgres">PostgreSQL</option>
          <option value="sqlserver">SQL Server</option>
        </select>
      </div>
      <div>
        <label for="source">Source name</label>
        <input id="source" value="paste.sql" style="width:100%;border:1px solid var(--border);border-radius:8px;background:var(--panel);color:var(--text);padding:0.7rem 0.8rem;font:inherit" />
      </div>
    </div>

    <label for="ddl">DDL</label>
    <textarea id="ddl">CREATE TABLE users (
  id INT,
  name VARCHAR(100)
);</textarea>

    <p style="margin:1rem 0">
      <button id="run" type="button">Analyze</button>
    </p>
    <div id="err"></div>
    <div id="out"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const fmt = (n) => (n == null ? "—" : Number(n).toLocaleString() + " B");

    $("run").onclick = async () => {
      $("err").textContent = "";
      $("out").innerHTML = "";
      $("run").disabled = true;
      try {
        const res = await fetch("/api/v1/analysis-sessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            engine: $("engine").value,
            source_name: $("source").value || "paste.sql",
            ddl_text: $("ddl").value,
          }),
        });
        const body = await res.json();
        if (!res.ok || body.error) {
          throw new Error((body.error && body.error.message) || res.statusText);
        }
        const d = body.data;
        const tables = d.tables || [];
        let html = `<div class="meta">Session <code>${d.id}</code> · total ${fmt(d.estimated_total_bytes)} · warnings ${d.warning_count ?? 0} · signals ${d.signal_count ?? 0}</div>`;
        html += `<table><thead><tr><th>Table</th><th>Cols</th><th>Row</th><th>Rows</th><th>Volume</th></tr></thead><tbody>`;
        for (const t of tables) {
          html += `<tr>
            <td>${t.name}</td>
            <td>${t.column_count}</td>
            <td>${fmt(t.estimated_row_bytes)}</td>
            <td>${t.assumed_row_count}</td>
            <td>${fmt(t.estimated_table_bytes)}</td>
          </tr>`;
        }
        html += `</tbody></table>`;
        if ((d.warnings || []).length) {
          html += `<h3>Warnings</h3><ul>` + d.warnings.map(w => `<li><strong>${w.code}</strong> ${w.table}${w.column ? "." + w.column : ""} — ${w.message}</li>`).join("") + `</ul>`;
        }
        if ((d.signals || []).length) {
          html += `<h3>Signals</h3><ul>` + d.signals.map(s => `<li><strong>${s.code}</strong> ${s.table} — ${s.message}</li>`).join("") + `</ul>`;
        }
        $("out").innerHTML = html;
      } catch (e) {
        $("err").textContent = e.message || String(e);
      } finally {
        $("run").disabled = false;
      }
    };
  </script>
</body>
</html>
